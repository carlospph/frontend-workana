<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>

    <!-- icones  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Importando Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-10">

    <section class="flex flex-col max-w-[450px] mx-auto gap-4">
        <img src="https://cf.wkncdn.com/static/assets/build/img/logos/free_logo_pt_BR.d6ef92b89.svg" alt="" class="mx-auto w-[200px]">

        <h1 class="text-2xl font-bold mb-5 text-center">Login</h1>

        <div class="mb-4">
            <label for="">E-mail</label>
            <input class="border border-gray-300 rounded-[15px] py-3 px-7 w-full" type="text" placeholder="E-mail" id="inputEmail">
        </div>

        <div class="mb-4">
            <label for="">Senha</label>
            <input class="border border-gray-300 rounded-[15px] py-3 px-7 w-full" type="password" placeholder="Senha" id="inputSenha">
        </div>

        <button class="block bg-blue-500 text-white py-2 px-4 rounded-full min-w-[160px] mx-auto cursor-pointer" id="btnLogin">Login</button>

        <div class="flex items-center my-4">
            <div class="flex-grow border-t border-gray-400"></div>
            <span class="flex-shrink mx-4 text-gray-400">ou</span>
            <div class="flex-grow border-t border-gray-400"></div>
        </div>

      <button class="flex items-center justify-center gap-2 bg-blue-800 text-white py-2 px-4 rounded-full">
    <i class="fa-brands fa-facebook-f"></i>
    <span>Continuar com Facebook</span>
</button>

<button class="flex items-center justify-center gap-2 border border-gray-300 text-black py-2 px-4 rounded-full">
    <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" alt="Google" class="w-5 h-5">
    <span>Continuar com Google</span>
</button>

<button class="flex items-center justify-center gap-2 bg-black text-white py-2 px-4 rounded-full">
    <i class="fa-brands fa-apple text-xl"></i>
    <span>Conectar com o iPhone</span>
</button>

    </section>

    <script src="Js/index.js"></script>
</body>

</html>
